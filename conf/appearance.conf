#####################
### LOOK AND FEEL ###
#####################

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in  = 1
    gaps_out = 2

    border_size = 1

    col.active_border = rgba(0,66,255,00)
    col.inactive_border =  rgba(0,66,255,0)

    resize_on_border = true

    allow_tearing = false

    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding       = 1
    rounding_power = 5

    shadow {
        enabled      = false
        range        = 30
        render_power = 3
        color        = rgb(FFFFFF)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled        = true
        size           = 2
        passes         = 1
        vibrancy       = 50
        ignore_opacity = true
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    #           NAME,               ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,             1,     10,    default
    animation = border,             1,     3.77,  easeOutQuint
    animation = windows,            1,     3.35,  easeOutQuint
    animation = windowsIn,          1,     4.0,   easeOutQuint, popin 80%
    animation = windowsOut,         1,     1.25,  easeOutQuint, popin 80%
    animation = fadeIn,             1,     1.21,  easeOutQuint
    animation = fadeOut,            1,     1.02,  easeOutQuint
    animation = fade,               1,     2.12,  easeOutQuint
    animation = layers,             1,     2.67,  easeOutQuint
    animation = layersIn,           1,     2.8,   easeOutQuint, fade
    animation = layersOut,          1,     1.05,  easeOutQuint, fade
    animation = fadeLayersIn,       1,     1.25,  easeOutQuint
    animation = fadeLayersOut,      1,     0.97,  easeOutQuint
    animation = workspaces,         1,     1.8,   easeOutQuint, slide
    animation = workspacesIn,       1,     1.8,   easeOutQuint, slide
    animation = workspacesOut,      1,     1.8,   easeOutQuint, slide
    animation = specialWorkspace,   1,     2.1,   easeOutQuint, fade
    animation = zoomFactor,         1,     4.9,   quick
}

# https://wiki.hypr.land/Configuring/Dwindle-Layout/
#dwindle {
#    pseudotile     = true
#    preserve_split = true
#}
#
# https://wiki.hypr.land/Configuring/Master-Layout/
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo   = true
    enable_swallow          = true
    swallow_regex           = ^(kitty)$
}
