###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

# Apps
bind = SUPER, RETURN, exec, $terminal
bind = SUPER, E,      exec, $fileManager
bind = SUPER, P,      exec, $taskmanager
bind = SUPER, B,      exec, $browser
bind = SUPER, T,      exec, $ide 
bind = SUPER, N,      exec, $notes
# bind = SUPER, R,      exec, tofi-drun | xargs -r -I{} sh -lc "{}"
bind = SUPER, R,      exec, fuzzel
bind = SUPER, C,      exec, qalculate-gtk
bind = SUPER, V,      exec, cliphist list | fuzzel --dmenu | cliphist decode | wl-copy
bind = SUPER, TAB,    exec, ~/.config/hypr/scripts/window-switcher
bind = SUPER, x,      submap, power

# Window management
bind = SUPER,       Q,     killactive
bind = SUPER,       F,     fullscreen, 1
bind = SUPER,       SPACE, togglefloating
bind = SUPER,       S,     layoutmsg, togglesplit
bind = SUPER SHIFT, E,     exec, ~/.config/hypr/scripts/resetsplits

# Focus (HJKL)
bind = SUPER, H, movefocus, l
bind = SUPER, J, movefocus, d
bind = SUPER, K, movefocus, u
bind = SUPER, L, movefocus, r

# Move windows (HJKL)
bind = SUPER SHIFT, H, movewindow, l
bind = SUPER SHIFT, J, movewindow, d
bind = SUPER SHIFT, K, movewindow, u
bind = SUPER SHIFT, L, movewindow, r

# Special workspace (scratchpad)
bind = SUPER,       grave, togglespecialworkspace
bind = SUPER SHIFT, grave, movetoworkspace, special

# Workspaces 1–10
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

# Move window to workspace
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

# Scroll through workspaces
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up,   workspace, e-1

# Move/resize windows with mouse
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# Session control
bind = SUPER,       M,     exec, hyprctl dispatch exit
bind = SUPER SHIFT, C,     exec, hyprctl reload

# Volume (wpctl)
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 10%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 10%-
bindel = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute,     exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Media (playerctl)
bindl = , XF86AudioNext,  exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay,  exec, playerctl play-pause
bindl = , XF86AudioPrev,  exec, playerctl previous

# Brightness (brightnessctl)
bindl = ,    XF86MonBrightnessUp,   exec, brightnessctl set +10%
bindl = ,    XF86MonBrightnessDown, exec, brightnessctl set 10%-
bindl = SUPER, XF86MonBrightnessUp,   exec, brightnessctl set +5%
bindl = SUPER, XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Screenshots (hyprshot)
bind = SHIFT,       Print, exec, hyprshot -m region --silent --clipboard-only
bind = SUPER SHIFT, Print, exec, hyprshot -m region --silent -o /home/mdracc/documents/pictures/screenshots/ -f "$(date +'%Y-%m-%d_%H-%M-%S').png"

bind = , Print, exec, wayfreeze & sleep 0.1 && hyprshot -m region --silent --clipboard-only; pkill wayfreeze
bind = SUPER, Print, exec, wayfreeze & sleep 0.1 && hyprshot -m region --silent -o /home/mdracc/documents/pictures/screenshots/ -f "$(date +'%Y-%m-%d_%H-%M-%S').png"; pkill wayfreeze
# Power submap
submap = power
bind = SUPER, L, exec, ~/.config/hypr/scripts/hyprlock-blur
bind = SUPER, L, submap, reset
bind = SUPER, P, exec, systemctl poweroff
bind = SUPER, R, exec, systemctl reboot
bind = SUPER, S, exec, systemctl suspend
bind = SUPER, S, submap, reset
bind = SUPER, O, exec, hyprctl dispatch exit
bind = ,      escape,   submap, reset
bind = ,      catchall, submap, reset
submap = reset
