###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

# Apps (shared — machine keybinds.conf adds device-specific ones)
bind = SUPER, RETURN, exec, $terminal
bind = SUPER, B,      exec, $browser
bind = SUPER, R,      exec, fuzzel
bind = SUPER, V,      exec, cliphist list | fuzzel --dmenu | cliphist decode | wl-copy
bind = SUPER, TAB,    exec, ~/.config/hypr/scripts/window-switcher
bind = SUPER, x,      submap, power
bind = SUPER, W,      submap, resize

# Annotate last screenshot (see Screenshots below)
bind = SUPER, N, exec, bash -c 'f=$(cat /tmp/last-screenshot 2>/dev/null) && [ -f "$f" ] && satty --filename "$f"'

# Window management
bind = SUPER,       Q,     killactive
bind = SUPER,       F,     fullscreen, 1
bind = SUPER,       SPACE, togglefloating
bind = SUPER,       S,     layoutmsg, togglesplit
bind = SUPER SHIFT, S,     layoutmsg, rotatesplit
bind = SUPER SHIFT, E,     exec, ~/.config/hypr/scripts/resetsplits
bind = SUPER SHIFT, C,     exec, hyprctl reload

# Focus (HJKL)
bind = SUPER, H, movefocus, l
bind = SUPER, J, movefocus, d
bind = SUPER, K, movefocus, u
bind = SUPER, L, movefocus, r

# Move windows (HJKL)
bind = SUPER SHIFT, H, movewindow, l
bind = SUPER SHIFT, J, movewindow, d
bind = SUPER SHIFT, K, movewindow, u
bind = SUPER SHIFT, L, movewindow, r

# Special workspace (scratchpad)
bind = SUPER,       grave, togglespecialworkspace
bind = SUPER SHIFT, grave, movetoworkspace, special

# Workspaces 1–10
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

# Move window to workspace
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

# Move all windows on active workspace to target workspace
bind = SUPER CTRL, 1, exec, ~/.config/hypr/scripts/workspace-send-all 1
bind = SUPER CTRL, 2, exec, ~/.config/hypr/scripts/workspace-send-all 2
bind = SUPER CTRL, 3, exec, ~/.config/hypr/scripts/workspace-send-all 3
bind = SUPER CTRL, 4, exec, ~/.config/hypr/scripts/workspace-send-all 4
bind = SUPER CTRL, 5, exec, ~/.config/hypr/scripts/workspace-send-all 5
bind = SUPER CTRL, 6, exec, ~/.config/hypr/scripts/workspace-send-all 6
bind = SUPER CTRL, 7, exec, ~/.config/hypr/scripts/workspace-send-all 7
bind = SUPER CTRL, 8, exec, ~/.config/hypr/scripts/workspace-send-all 8
bind = SUPER CTRL, 9, exec, ~/.config/hypr/scripts/workspace-send-all 9
bind = SUPER CTRL, 0, exec, ~/.config/hypr/scripts/workspace-send-all 10

# Scroll workspaces
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up,   workspace, e-1

# Move/resize with mouse
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# Session
bind = SUPER, M, exec, ~/.config/hypr/scripts/session-exit

# Volume
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute,     exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Media
bindl = , XF86AudioNext,  exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay,  exec, playerctl play-pause
bindl = , XF86AudioPrev,  exec, playerctl previous

# Brightness
bindl = ,      XF86MonBrightnessUp,   exec, brightnessctl set +10%
bindl = ,      XF86MonBrightnessDown, exec, brightnessctl set 10%-
bindl = SUPER, XF86MonBrightnessUp,   exec, brightnessctl set +5%
bindl = SUPER, XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Screenshots — to clipboard
bind = ,      Print, exec, ~/.config/hypr/scripts/screenshot area   clip
bind = SHIFT, Print, exec, ~/.config/hypr/scripts/screenshot active clip
# Screenshots — to file (notification has actions: swayimg / ranger / kitty)
bind = SUPER,       Print, exec, ~/.config/hypr/scripts/screenshot area   file
bind = SUPER SHIFT, Print, exec, ~/.config/hypr/scripts/screenshot active file

# Resize submap: hold SUPER+W, mash HJKL to resize, release W to exit
submap = resize
binde = SUPER, H, resizeactive, -40 0
binde = SUPER, J, resizeactive, 0 40
binde = SUPER, K, resizeactive, 0 -40
binde = SUPER, L, resizeactive, 40 0
bindrt = SUPER, W, submap, reset
bindrt = ,      W, submap, reset
bind  = ,      escape,   submap, reset
bind  = ,      catchall, submap, reset
submap = reset

# Power submap
submap = power
bind = SUPER, L, exec, ~/.config/hypr/scripts/hyprlock-blur
bind = SUPER, L, submap, reset
bind = SUPER, A, exec, ~/.config/hypr/scripts/away-mode
bind = SUPER, A, submap, reset
bind = SUPER, P, exec, systemctl poweroff
bind = SUPER, R, exec, systemctl reboot
bind = SUPER, S, exec, systemctl suspend
bind = SUPER, S, submap, reset
bind = SUPER, O, exec, ~/.config/hypr/scripts/session-exit
bind = ,      escape,   submap, reset
bind = ,      catchall, submap, reset
submap = reset

# Lockscreen power (l flag = fires while locked; submap can't be entered while locked)
# Requires SHIFT to avoid colliding with normal SUPER+P/R binds, which bindl doesn't restrict to locked-only
bindl = SUPER SHIFT, P, exec, systemctl poweroff
bindl = SUPER SHIFT, R, exec, systemctl reboot
