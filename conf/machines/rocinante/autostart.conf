#################
### AUTOSTART ###
#################

# Daemons are systemd user units under graphical-session.target —
# see docs/systemd-session.md. Env import and target start must share
# one exec-once so they run in order.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP DISPLAY && systemctl --user start hyprland-session.target

exec-once = ~/.config/hypr/scripts/wallpaper-restore
exec-once = eww daemon
exec-once = /usr/bin/gnome-keyring-daemon --start --components=secrets,pkcs11,ssh
