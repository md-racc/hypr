# Locking goes through scripts/lockscreen (supervises hyprlock; see its header).
# Away mode (SUPER+X, A) holds sleep + lid-switch inhibitors, so the suspend
# listener below is refused while it's active.

general {
    lock_cmd         = ~/.config/hypr/scripts/lockscreen lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = ~/.config/hypr/scripts/lockscreen resume
    inhibit_sleep    = 3   # delay sleep until the session is actually locked
}

# 4:30 dim
listener {
    timeout    = 270
    on-timeout = brightnessctl -s set 50%
    on-resume  = brightnessctl -r
}

# 4:45 warn
listener {
    timeout    = 285
    on-timeout = notify-send -u normal -t 14000 "Locking soon" "Screen locks in 15 seconds"
}

# 5:00 lock
listener {
    timeout    = 300
    on-timeout = loginctl lock-session
}

# 15:00 suspend
listener {
    timeout    = 900
    on-timeout = systemctl suspend
}
