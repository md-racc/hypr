general {
    lock_cmd         = pidof hyprlock || ~/.config/hypr/scripts/hyprlock-blur
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# Warn 30s before lock
listener {
    timeout    = 270
    on-timeout = notify-send -u normal -t 29000 "Locking soon" "Screen locks in 30 seconds"
}

# Lock after 5 min
listener {
    timeout    = 300
    on-timeout = loginctl lock-session
}

# Dim screen to 50% after 10 min
listener {
    timeout    = 600
    on-timeout = brightnessctl -s set 50%
    on-resume  = brightnessctl -r
}

# Suspend after 15 min
listener {
    timeout    = 900
    on-timeout = systemctl suspend
}
