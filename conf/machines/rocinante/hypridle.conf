# Lock after 5 min
listener {
    timeout    = 300
    on-timeout = ~/.config/hypr/scripts/hyprlock-blur
}

# Dim screen to 50% after 10 min
listener {
    timeout    = 600
    on-timeout = brightnessctl -s set 50%
    on-resume  = brightnessctl -r
}

# Suspend after 15 min
listener {
    timeout    = 900
    on-timeout = systemctl suspend
}
