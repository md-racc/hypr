background {
  monitor     = eDP-1
  path        = /tmp/hyprlock-eDP-1.png
  blur_passes = 2
  brightness  = 0.6
  blur_size   = 8
  noise       = 0.01
}

label {
  monitor     = eDP-1
  text        = cmd[update:1000] echo "<b>$(date +%H:%M:%S)</b>"
  color       = rgba(255, 255, 255, 0.9)
  font_size   = 95
  font_family = JetBrains Mono Bold
  position    = 0, 300
  halign      = center
  valign      = center
}

label {
  monitor     = eDP-1
  text        = cmd[update:1000] date +"%A, %B %d"
  color       = rgba(255, 255, 255, 0.9)
  font_size   = 22
  font_family = JetBrains Mono
  position    = 0, 200
  halign      = center
  valign      = center
}

general {
  auth_method = pam
}

bind = SUPER, P, exec, systemctl poweroff
bind = SUPER, R, exec, systemctl reboot
