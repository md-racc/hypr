background {
  monitor     = eDP-1
  path        = /tmp/hyprlock-eDP-1.png
  blur_passes = 2
  brightness  = 0.6
  blur_size   = 8
  noise       = 0.01
}

label {
  monitor     = eDP-1
  text        = cmd[update:1000] echo "<b>$(date +%H:%M:%S)</b>"
  color       = rgba(255, 255, 255, 0.9)
  font_size   = 95
  font_family = JetBrains Mono Bold
  position    = 0, 300
  halign      = center
  valign      = center
}

label {
  monitor     = eDP-1
  text        = cmd[update:1000] date +"%A, %B %d"
  color       = rgba(255, 255, 255, 0.9)
  font_size   = 22
  font_family = JetBrains Mono
  position    = 0, 200
  halign      = center
  valign      = center
}

label {
  monitor     = eDP-1
  text        = cmd[update:30000] bash -c 'cap=$(cat /sys/class/power_supply/BAT0/capacity); stat=$(cat /sys/class/power_supply/BAT0/status); [ "$stat" = "Charging" ] && echo "${cap}% +" || echo "${cap}%"'
  color       = rgba(255, 255, 255, 0.9)
  font_size   = 18
  font_family = JetBrains Mono
  position    = -30, -30
  halign      = right
  valign      = top
}

# No input-field on this lockscreen, so Enter-to-wake submitted an empty
# password — each one a failed attempt toward faillock.
general {
  ignore_empty_input = true
}

# Fingerprint is handled by hyprlock itself (fprintd over D-Bus), not by PAM.
# pam_fprintd in the PAM stack errored across suspend ("Cannot run while
# suspended"), each error counted as a failed login, and after 3 pam_faillock
# locked the account for 10 min. PAM now only checks the password, via a
# fingerprint-free service: /etc/pam.d/hyprlock-nofp.
auth {
  pam {
    enabled = true
    module  = hyprlock-nofp
  }
  fingerprint {
    enabled         = true
    ready_message   = touch to unlock
    present_message = scanning…
    retry_delay     = 250
  }
}

label {
  monitor     = eDP-1
  text        = $FPRINTPROMPT
  color       = rgba(255, 255, 255, 0.6)
  font_size   = 13
  font_family = JetBrains Mono
  position    = 0, -250
  halign      = center
  valign      = center
}

