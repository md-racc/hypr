# Colours: built-in defaults, then the active wallust scheme's values (wallust templates/hyprlock-colors.conf,
# rendered by `theme`). hyprlang reports a missing `source` and carries on with the defaults, so the lock
# screen never depends on wallust (verified with hyprlock 0.9.7: "Proceeding ignoring faulty entries").
$lock_fg        = rgba(242, 243, 244, 0.75)
$lock_fg_strong = rgba(255, 255, 255, 0.9)
$lock_dim       = rgba(242, 243, 244, 0.35)
$lock_warn      = rgba(242, 200, 120, 0.55)
source = ~/.cache/wallust/hyprlock-colors.conf

background {
  monitor     = eDP-1
  path        = /tmp/hyprlock-eDP-1.png
  blur_passes = 2
  brightness  = 0.6
  blur_size   = 8
  noise       = 0.01
}

label {
  monitor     = eDP-1
  text        = cmd[update:1000] echo "<b>$(date +%H:%M:%S)</b>"
  color       = $lock_fg_strong
  font_size   = 95
  font_family = JetBrains Mono Bold
  position    = 0, 300
  halign      = center
  valign      = center
}

label {
  monitor     = eDP-1
  text        = cmd[update:1000] date +"%A, %B %d"
  color       = $lock_fg_strong
  font_size   = 22
  font_family = JetBrains Mono
  position    = 0, 200
  halign      = center
  valign      = center
}

label {
  monitor     = eDP-1
  text        = cmd[update:30000] bash -c 'cap=$(cat /sys/class/power_supply/BAT0/capacity); stat=$(cat /sys/class/power_supply/BAT0/status); [ "$stat" = "Charging" ] && echo "${cap}% +" || echo "${cap}%"'
  color       = $lock_fg_strong
  font_size   = 13
  font_family = JetBrains Mono
  position    = -12, -12
  halign      = right
  valign      = top
}

# No input-field: type the password blind + Enter. Empty input (Enter to
# wake) is ignored rather than counted; a wrong password costs 3s.
general {
  ignore_empty_input = true
  fail_timeout       = 3000
}

# Password: PAM via /etc/pam.d/hyprlock-nofp (pam_unix only — no fprintd, no
# faillock). Fingerprint: not hyprlock's; scripts/lockscreen scans only when
# Enter is pressed and unlocks with SIGUSR1 on a match (see its header).
auth {
  pam {
    enabled = true
    module  = hyprlock-nofp
  }
  fingerprint {
    enabled = false
  }
}

