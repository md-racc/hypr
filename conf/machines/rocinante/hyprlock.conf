background {
  monitor     = eDP-1
  path        = /tmp/hyprlock-eDP-1.png
  blur_passes = 2
  brightness  = 0.6
  blur_size   = 8
  noise       = 0.01
}

label {
  monitor     = eDP-1
  text        = cmd[update:1000] echo "<b>$(date +%H:%M:%S)</b>"
  color       = rgba(255, 255, 255, 0.9)
  font_size   = 95
  font_family = JetBrains Mono Bold
  position    = 0, 300
  halign      = center
  valign      = center
}

label {
  monitor     = eDP-1
  text        = cmd[update:1000] date +"%A, %B %d"
  color       = rgba(255, 255, 255, 0.9)
  font_size   = 22
  font_family = JetBrains Mono
  position    = 0, 200
  halign      = center
  valign      = center
}

label {
  monitor     = eDP-1
  text        = cmd[update:30000] bash -c 'cap=$(cat /sys/class/power_supply/BAT0/capacity); stat=$(cat /sys/class/power_supply/BAT0/status); [ "$stat" = "Charging" ] && echo "${cap}% +" || echo "${cap}%"'
  color       = rgba(255, 255, 255, 0.9)
  font_size   = 13
  font_family = JetBrains Mono
  position    = -12, -12
  halign      = right
  valign      = top
}

# No input-field: type the password blind + Enter. Empty input (Enter to
# wake) is ignored rather than counted; a wrong password costs 3s.
general {
  ignore_empty_input = true
  fail_timeout       = 3000
}

# No fade in/out: the lock appears and disappears immediately.
animations {
  enabled = false
}

# Password: PAM via /etc/pam.d/hyprlock-nofp (pam_unix only — no fprintd, no
# faillock). Fingerprint: not hyprlock's; scripts/lockscreen scans only when
# Enter is pressed and unlocks with SIGUSR1 on a match (see its header).
auth {
  pam {
    enabled = true
    module  = hyprlock-nofp
  }
  fingerprint {
    enabled = false
  }
}

