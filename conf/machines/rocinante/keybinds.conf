###################################
### ROCINANTE-SPECIFIC KEYBINDS ###
###################################

bind = SUPER, E, exec, $fileManager
bind = SUPER, P, exec, $taskmanager
bind = SUPER, T, exec, $ide
bind = SUPER, O, exec, $notes
bind = SUPER, C, exec, ~/.config/hypr/scripts/netmenu

bind = SUPER, Z, exec, eww open bar --toggle

# Keyboard backlight (tpacpi::kbd_backlight, max 2)
bindl = ALT, XF86MonBrightnessUp,   exec, brightnessctl -d tpacpi::kbd_backlight set +1
bindl = ALT, XF86MonBrightnessDown, exec, brightnessctl -d tpacpi::kbd_backlight set 1-
