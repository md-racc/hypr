# Media playback inhibits idle via the standard Wayland/dbus protocol,
# which hypridle honors by default — no config needed for it.

general {
    lock_cmd         = ~/.config/hypr/scripts/lockscreen lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = ~/.config/hypr/scripts/lockscreen resume
    inhibit_sleep    = 3   # delay sleep until the session is actually locked
}

# Warn 30s before lock
listener {
    timeout    = 870
    on-timeout = notify-send -u normal -t 29000 "Locking soon" "Screen locks in 30 seconds"
}

# Lock after 15 min
listener {
    timeout    = 900
    on-timeout = loginctl lock-session
}

# No screens-off listener: DPMS off while locked crashes Hyprland 0.57 on
# this NVIDIA card (see can_blank in scripts/lockscreen). Restore the 20-min
# `hl.dsp.dpms({action = "off"})` listener once upstream fixes it.

# Suspend after 30 min
listener {
    timeout    = 1800
    on-timeout = systemctl suspend
}
