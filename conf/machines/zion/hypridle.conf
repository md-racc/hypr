# Media playback inhibits idle via the standard Wayland/dbus protocol,
# which hypridle honors by default — no config needed for it.

general {
    lock_cmd         = ~/.config/hypr/scripts/lockscreen lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = ~/.config/hypr/scripts/lockscreen resume
    inhibit_sleep    = 3   # delay sleep until the session is actually locked
}

# Warn 30s before lock
listener {
    timeout    = 870
    on-timeout = notify-send -u normal -t 29000 "Locking soon" "Screen locks in 30 seconds"
}

# Lock after 15 min
listener {
    timeout    = 900
    on-timeout = loginctl lock-session
}

# Screens off after 20 min, over DDC/CI rather than Hyprland's DPMS: a DPMS
# off (or the DPMS on after resume) while locked crashes Hyprland 0.57 on this
# NVIDIA card (see can_blank in scripts/lockscreen). DDC power is in the panel;
# Hyprland sees nothing. Any input wakes them (on-resume), keys or mouse: the
# old DPMS listener woke on keys only (key_press_enables_dpms).
# Back to `hl.dsp.dpms({action = "off"/"on"})` once upstream fixes the crash.
listener {
    timeout    = 1200
    on-timeout = ~/.config/hypr/scripts/ddc-power off
    on-resume  = ~/.config/hypr/scripts/ddc-power on
}

# Suspend after 30 min
listener {
    timeout    = 1800
    on-timeout = systemctl suspend
}
