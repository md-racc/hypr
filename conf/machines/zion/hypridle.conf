inhibitor {
    name   = media
    class  = org.mpris.MediaPlayer2.*
    kinds  = audio, video
}

# Lock after 15 min
listener {
    timeout    = 900
    on-timeout = ~/.config/hypr/scripts/hyprlock-blur
    inhibitor  = media
}

# Suspend after 30 min
listener {
    timeout    = 1800
    on-timeout = systemctl suspend
    inhibitor  = media
}
