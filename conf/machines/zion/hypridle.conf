# Media playback inhibits idle via the standard Wayland/dbus protocol,
# which hypridle honors by default — no config needed for it.

general {
    lock_cmd         = pidof hyprlock || ~/.config/hypr/scripts/hyprlock-blur
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = hyprctl dispatch dpms on
}

# Lock after 15 min
listener {
    timeout    = 900
    on-timeout = loginctl lock-session
}

# Screens off after 20 min
listener {
    timeout    = 1200
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

# Suspend after 30 min
listener {
    timeout    = 1800
    on-timeout = systemctl suspend
}
