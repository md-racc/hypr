background {
  monitor = DP-3
  path = screenshot
  blur_passes = 2
  blur_size = 7
  noise = 0.0117
}
background {
  monitor = HDMI-A-1
  path = screenshot
  blur_passes = 2
  blur_size = 7
  noise = 0.0117
}

input-field {
  monitor       = DP-3
  size          = 260, 54
  halign        = center
  valign        = center
  position      = 0, -110
  rounding      = -1
  hide_input    = false
  dots_center   = true
  dots_size     = 0.20
  dots_spacing  = 0.35
  fade_on_empty = false

  inner_color       = rgba(0, 0, 0, 0.20)
  outer_color       = rgba(0, 0, 0, 0.00)
  outline_thickness = 2
  check_color       = rgb(0, 66, 255)
  font_color        = rgb(0, 66, 255)
  placeholder_text  =
  fail_text         =
}

label {
  monitor     = DP-3
  text        = cmd[update:1000] date +"%H:%M:%S"
  font_family = JetBrains Mono Bold
  font_size   = 96
  color       = rgba(242, 243, 244, 0.75)
  halign      = center
  valign      = center
  position    = 0, 300
}
label {
  monitor     = DP-3
  text        = cmd[update:1000] date +"%A, %B %d"
  font_family = JetBrains Mono
  font_size   = 20
  color       = rgba(242, 243, 244, 0.75)
  halign      = center
  valign      = center
  position    = 0, 160
}
label {
  monitor     = HDMI-A-1
  text        = cmd[update:1000] date +"%H:%M:%S"
  font_family = JetBrains Mono Bold
  font_size   = 96
  color       = rgba(242, 243, 244, 0.75)
  halign      = center
  valign      = center
  position    = 0, 300
}
label {
  monitor     = HDMI-A-1
  text        = cmd[update:1000] date +"%A, %B %d"
  font_family = JetBrains Mono
  font_size   = 20
  color       = rgba(242, 243, 244, 0.75)
  halign      = center
  valign      = center
  position    = 0, 160
}

# Empty input (Enter to wake) is ignored rather than counted; a wrong
# password costs 3s.
general {
  ignore_empty_input = true
  fail_timeout       = 3000
}

# Password: PAM via /etc/pam.d/hyprlock-nofp (pam_unix only — no faillock).
# The default service chains to system-auth's pam_faillock: 3 attempts on a
# black post-resume screen locked the account, tty login included (2026-09-26).
auth {
  pam {
    enabled = true
    module  = hyprlock-nofp
  }
  fingerprint {
    enabled = false
  }
}

