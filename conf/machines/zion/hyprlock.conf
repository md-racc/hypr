# Colours: built-in defaults, then the active wallust scheme's values (wallust templates/hyprlock-colors.conf,
# rendered by `theme`). hyprlang reports a missing `source` and carries on with the defaults, so the lock
# screen never depends on wallust (verified with hyprlock 0.9.7: "Proceeding ignoring faulty entries").
$lock_fg        = rgba(242, 243, 244, 0.75)
$lock_fg_strong = rgba(255, 255, 255, 0.9)
$lock_dim       = rgba(242, 243, 244, 0.35)
$lock_warn      = rgba(242, 200, 120, 0.55)
source = ~/.cache/wallust/hyprlock-colors.conf

background {
  monitor = DP-3
  path = screenshot
  blur_passes = 2
  blur_size = 7
  noise = 0.0117
}
background {
  monitor = HDMI-A-1
  path = screenshot
  blur_passes = 2
  blur_size = 7
  noise = 0.0117
}

# Near-blind input: no box or outline, only small faint dots while typing.
# A failed attempt leaves a faint × in their place until you type again
# (fail_text is literal text: no Pango markup, it inherits font_color).
input-field {
  monitor       = DP-3
  size          = 220, 30
  halign        = center
  valign        = center
  position      = 0, -110
  hide_input    = false
  dots_center   = true
  dots_size     = 0.14
  dots_spacing  = 0.60
  fade_on_empty = false

  outline_thickness = 0
  inner_color       = rgba(0, 0, 0, 0)
  outer_color       = rgba(0, 0, 0, 0)
  check_color       = rgba(0, 0, 0, 0)
  fail_color        = rgba(0, 0, 0, 0)
  font_color        = $lock_dim
  placeholder_text  =
  fail_text         = ×
}

label {
  monitor     = DP-3
  text        = cmd[update:1000] date +"%H:%M:%S"
  font_family = JetBrains Mono Bold
  font_size   = 96
  color       = $lock_fg
  halign      = center
  valign      = center
  position    = 0, 300
}
label {
  monitor     = DP-3
  text        = cmd[update:1000] date +"%A, %B %d"
  font_family = JetBrains Mono
  font_size   = 20
  color       = $lock_fg
  halign      = center
  valign      = center
  position    = 0, 160
}
# Caps Lock warning below the input. Globs every keyboard's LED: the inputN
# numbers change on replug.
label {
  monitor     = DP-3
  text        = cmd[update:250] grep -qsx 1 /sys/class/leds/*::capslock/brightness && echo "caps lock"
  font_family = JetBrains Mono
  font_size   = 11
  color       = $lock_warn
  halign      = center
  valign      = center
  position    = 0, -150
}
label {
  monitor     = HDMI-A-1
  text        = cmd[update:1000] date +"%H:%M:%S"
  font_family = JetBrains Mono Bold
  font_size   = 96
  color       = $lock_fg
  halign      = center
  valign      = center
  position    = 0, 300
}
label {
  monitor     = HDMI-A-1
  text        = cmd[update:1000] date +"%A, %B %d"
  font_family = JetBrains Mono
  font_size   = 20
  color       = $lock_fg
  halign      = center
  valign      = center
  position    = 0, 160
}

# Empty input (Enter to wake) is ignored rather than counted; a wrong
# password costs 3s.
general {
  ignore_empty_input = true
  fail_timeout       = 3000
}

# Password: PAM via /etc/pam.d/hyprlock-nofp (pam_unix only — no faillock).
# The default service chains to system-auth's pam_faillock: 3 attempts on a
# black post-resume screen locked the account, tty login included (2026-09-26).
auth {
  pam {
    enabled = true
    module  = hyprlock-nofp
  }
  fingerprint {
    enabled = false
  }
}

