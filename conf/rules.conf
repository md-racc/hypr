##############################
### WINDOWS AND WORKSPACES ###
##############################

# Gnome apps
windowrule {
  name  = gnome-float
  float = on
  match:class = (org.gnome.*)
}

windowrule {
  name = calculator-position
  size = 400 620
  move = (6) (453)
  match:class = (org.gnome.Calculator)
}

windowrule {
  name = calendar-position
  size = 360 600
  move = (6) (474)
  match:class = (org.gnome.Calendar)
}

# Media
windowrule {
  name   = mpv-float
  float  = on
  size   = 1280 720
  center = on
  match:class = (mpv)
}

windowrule {
  name = spotify-tile
  tile = on
  match:class = ^(Spotify)$
}

# System tools
windowrule {
  name  = resources-float
  float = on
  match:class = (net.nokyan.Resources)
}

windowrule {
  name  = portal-float
  float = on
  match:class = (xdg-desktop-portal-gtk)
}

# File manager
windowrule {
  name  = nemo-float
  float = on
  match:class = (nemo)
}

# Scratchpad
windowrule {
  name      = scratchpad-float
  float     = on
  size      = 900 600
  center    = on
  workspace = special silent
  match:class = (scratchpad)
}

# Browser extensions
windowrule {
  name  = bitwarden-popup
  float = on
  size  = 463 606
  match:title = Extension: \(Bitwarden Password Manager\).*
}

# Qalculate
windowrule {
  name   = qalculate-float
  float  = on
  size   = 826 557
  center = on
  match:class = (qalculate-gtk)
}

# Global rules
windowrule {
  name           = suppress-maximize
  suppress_event = maximize
  match:class    = .*
}

# Fix XWayland drag issues
windowrule {
  name         = xwayland-nofocus
  no_focus     = on
  match:class      = ^$
  match:title      = ^$
  match:xwayland   = 1
  match:float      = 1
  match:fullscreen = 0
  match:pin        = 0
}
