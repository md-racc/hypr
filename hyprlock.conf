# ---------- Backgrounds ----------
background {
  monitor = DP-3
  path = screenshot
  blur_passes = 2
  blur_size = 7
  noise = 0.0117
  color = rgba(0, 0, 0, 1)
}
background {
  monitor = HDMI-A-1
  path = screenshot
  blur_passes = 2
  blur_size = 7
  noise = 0.0117
  color = rgba(0, 0, 0, 1)
}

# ---------- Avatar ----------
image {
  monitor = DP-3
  path = /home/$USER/Pictures/profile.png
  halign = center
  valign = center
  position = 0, 50
}

# ---------- Password field ----------
input-field {
  monitor = DP-3
  size = 260,54
  halign = center
  valign = center
  position = 0, -110
  rounding = -1
  hide_input = false
  dots_center = true
  dots_size = 0.20
  dots_spacing = 0.35
  fade_on_empty = false

  inner_color = rgba(0, 0, 0, 0.20)
  outer_color = rgba(0, 0, 0, 0.00)
  outline_thickness = 2
  check_color = rgb(0, 66, 255)  # accent
  font_color  = rgb(0, 66, 255)  # dots/text color
  placeholder_text = 
  fail_text =
}

# ---------- Time + Date on Both Screens ----------
label {
  monitor = DP-3
  text = cmd[update:1000] date +"%H:%M:%S"
  font_family = JetBrains Mono, bold 
  font_size = 96
  color = rgba(242, 243, 244, 0.75)
  halign = center
  valign = center
  position = 0, 300
}
label {
  monitor = DP-3
  text = cmd[update:1000] date +"%A, %B %d"
  font_family = JetBrains Mono
  font_size = 20
  color = rgba(242, 243, 244, 0.75)
  halign = center
  valign = center
  position = 0, 160
}
label {
  monitor = HDMI-A-1
  text = cmd[update:1000] date +"%H:%M:%S"
  font_family = JetBrains Mono, bold
  font_size = 96
  color = rgba(242, 243, 244, 0.75)
  halign = center
  valign = center
  position = 0, 300
}
label {
  monitor = HDMI-A-1
  text = cmd[update:1000] date +"%A, %B %d"
  font_family = JetBrains Mono 
  font_size = 20
  color = rgba(242, 243, 244, 0.75)
  halign = center
  valign = center
  position = 0, 160
}

general {
  auth_method = pam
}
