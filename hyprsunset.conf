###################
### NIGHT LIGHT ###
###################
# Requires the hyprsunset package; started from autostart.conf.

# Daytime — no filter
profile {
    time     = 7:30
    identity = true
}

# Evening — step down to warm across GNV sunset (20:00–20:30)
profile {
    time        = 20:00
    temperature = 6200
}
profile {
    time        = 20:05
    temperature = 5900
}
profile {
    time        = 20:10
    temperature = 5600
}
profile {
    time        = 20:15
    temperature = 5300
}
profile {
    time        = 20:20
    temperature = 5000
}
profile {
    time        = 20:25
    temperature = 4750
}
profile {
    time        = 20:30
    temperature = 4500
}
