# Drop-in for the packaged fnott.service (linked into ~/.config/systemd/user/fnott.service.d/ by
# scripts/setup-session-services). fnott exits with the compositor (broken pipe) and has no Restart=, so
# a Hyprland crash left notifications dead until the next login (2026-11-05). D-Bus activation would
# start it again on the next notification only if the old instance is gone.
[Unit]
StartLimitIntervalSec=2min
StartLimitBurst=10
OnFailure=unit-failed-notify@%n.service

[Service]
# direct: an auto-restart skips the failed state, so OnFailure= fires only when the start limit gives up
RestartMode=direct
Restart=on-failure
RestartSec=2
