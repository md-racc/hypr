# Drop-in for the packaged hypridle.service (linked into ~/.config/systemd/user/hypridle.service.d/ by
# scripts/setup-session-services). hypridle dies with the compositor and systemd restarts it, so its start is
# the one hook that runs after every Hyprland crash, locked or not: save the dead instance's log
# (scripts/hypr-crash-logs) before a hard reset wipes /run. "-": never blocks hypridle.
[Service]
ExecStartPre=-%h/.config/hypr/scripts/hypr-crash-logs
