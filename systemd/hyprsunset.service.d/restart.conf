# Drop-in for the packaged hyprsunset.service (linked into ~/.config/systemd/user/hyprsunset.service.d/ by
# scripts/setup-session-services). After a Hyprland crash it fails until the compositor is back, and the
# package's 100ms RestartSec burnt through the default 5-in-10s start limit within a second (2026-11-06
# 17:43: restart counter 6 to 10 in 1.1s), which would leave the night light off. The package already
# sets Restart=on-failure.
[Unit]
StartLimitIntervalSec=2min
StartLimitBurst=10
OnFailure=unit-failed-notify@%n.service

[Service]
# direct: an auto-restart skips the failed state, so OnFailure= fires only when the start limit gives up
RestartMode=direct
RestartSec=2
